# EstateTruth AI — Production Multi-Agent MLOps Stack
# Run: docker compose up -d
services:
  qdrant:
    image: qdrant/qdrant:v1.13.4
    container_name: estatetruth-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6333/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  opensearch:
    image: opensearchproject/opensearch:2.18.0
    container_name: estatetruth-opensearch
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data

  redis:
    image: redis:7.4-alpine
    container_name: estatetruth-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]

  langfuse-db:
    image: postgres:16-alpine
    container_name: estatetruth-langfuse-db
    environment:
      - POSTGRES_USER=langfuse
      - POSTGRES_PASSWORD=langfuse_dev_pass
      - POSTGRES_DB=langfuse
    ports:
      - "5433:5432"

  langfuse:
    image: langfuse/langfuse:2
    container_name: estatetruth-langfuse
    depends_on:
      - langfuse-db
    ports:
      - "3001:3000"
    environment:
      - DATABASE_URL=postgresql://langfuse:langfuse_dev_pass@langfuse-db:5432/langfuse
      - NEXTAUTH_SECRET=estatetruth_local_nextauth_secret_change_in_prod
      - SALT=estatetruth_local_salt_change_in_prod
      - NEXTAUTH_URL=http://localhost:3001

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: estatetruth-nestjs-api
    depends_on:
      - qdrant
      - opensearch
      - redis
      - langfuse
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - QDRANT_URL=http://qdrant:6333
      - OPENSEARCH_URL=http://opensearch:9200
      - REDIS_URL=redis://redis:6379
      - LANGFUSE_BASE_URL=http://langfuse:3000
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-pk-lf-local}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-sk-lf-local}
      - LLM_PRIMARY_PROVIDER=${LLM_PRIMARY_PROVIDER:-gemini}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}

volumes:
  qdrant_data:
  opensearch_data:
